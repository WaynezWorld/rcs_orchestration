# rcs_orchestration — sample configuration
# -----------------------------------------
# This file is intentionally minimal.  For production runs, override the
# relevant sections via environment variables or a separate config file.

output_root: "results"

logging:
  level: "INFO"

data_loading:
  # Set SEGMENT_DATA_ROOT env var or override here for real runs
  segment_data_root: "${env:SEGMENT_DATA_ROOT:-results/segments}"

feature_engineering:
  enabled: true
  # Add feature flags here as the FE module is integrated:
  # lag_periods: [1, 3, 6, 12]
  # rolling_windows: [3, 6]

forecasting:
  horizon: 12            # number of periods to forecast
  # model: "lightgbm"   # uncomment when real forecasting module is active

validation:
  enabled: true
  # thresholds:
  #   mape_warn: 10.0
  #   mape_fail: 25.0

export:
  type: "local"          # "local" for file-system export; "snowflake" for DB
  # snowflake:
  #   database: "RCS_SANDBOX"
  #   schema:   "FORECASTS"
  #   table:    "FORECAST_MART"
